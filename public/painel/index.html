<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1422">
<title>Central Plannex</title>
<link rel="icon" type="image/svg+xml" href="../assets/img/favicon-rounded.rev83.svg?v=83">
<link rel="stylesheet" href="./central.css">
</head>
<body>

<!-- Login -->
<main class="login" id="tela-login" hidden>
  <form class="login-cartao" id="form-login" novalidate>
    <img class="login-logo" src="../assets/img/logo-plannex-full-white.rev83.png?v=83" alt="Plannex" width="2048" height="385">
    <div>
      <h1>Central Plannex</h1>
      <p>Contatos, pedidos e prazos num lugar só.</p>
    </div>
    <label class="campo">Usuário
      <input id="login-usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label class="campo">Senha
      <input id="login-senha" name="senha" type="password" autocomplete="current-password" required>
    </label>
    <p class="aviso" id="login-erro" role="alert"></p>
    <button class="botao botao--primario botao--largo" type="submit" id="login-botao">Entrar</button>
  </form>
</main>

<!-- Central -->
<div class="app" id="tela-app" hidden>
  <aside class="lateral">
    <a class="marca" href="#/visao" aria-label="Central Plannex, visão geral">
      <img src="../assets/img/logo-plannex-full-white.rev83.png?v=83" alt="Plannex" width="2048" height="385">
      <span>Central</span>
    </a>
    <nav class="nav" aria-label="Seções da Central">
      <button type="button" class="nav-item" data-tela="visao" data-icone="visao"><span class="nav-rotulo">Visão geral</span></button>
      <button type="button" class="nav-item" data-tela="entrada" data-icone="entrada"><span class="nav-rotulo">Caixa de entrada</span><span class="nav-contagem"></span></button>
      <button type="button" class="nav-item" data-tela="andamento" data-icone="andamento"><span class="nav-rotulo">Andamento</span><span class="nav-contagem"></span></button>
      <button type="button" class="nav-item" data-tela="agenda" data-icone="agenda"><span class="nav-rotulo">Agenda</span></button>
      <button type="button" class="nav-item" data-tela="arquivo" data-icone="arquivo"><span class="nav-rotulo">Arquivo</span></button>
      <button type="button" class="nav-item" data-tela="equipe" data-icone="equipe"><span class="nav-rotulo">Equipe</span></button>
    </nav>
    <div class="lateral-rodape">
      <div class="eu">
        <span id="usuario-avatar"></span>
        <span class="eu-texto"><strong id="usuario-nome"></strong><small id="usuario-login"></small></span>
      </div>
      <div class="lateral-botoes">
        <button type="button" class="botao botao--fantasma botao--pequeno" id="minha-senha" data-icone="chave">Minha senha</button>
        <button type="button" class="botao botao--fantasma botao--pequeno" id="sair" data-icone="sair">Sair</button>
      </div>
    </div>
  </aside>

  <div class="principal">
    <header class="barra">
      <div class="busca" role="combobox" aria-haspopup="listbox" aria-owns="busca-resultados">
        <label class="busca-campo">
          <span class="sr">Buscar contato</span>
          <input type="search" id="busca-global" placeholder="Buscar contato…" autocomplete="off" aria-controls="busca-resultados" aria-autocomplete="list">
          <kbd>/</kbd>
        </label>
        <ul class="busca-resultados" id="busca-resultados" role="listbox" hidden></ul>
      </div>
      <span class="atualizado" id="atualizado"></span>
      <button type="button" class="botao botao--icone botao--fantasma" id="atualizar" data-icone="atualizar" title="Atualizar agora" aria-label="Atualizar agora"></button>
      <button type="button" class="botao botao--primario" id="novo-contato" data-icone="mais" title="Cadastrar contato (atalho: N)"><span class="some-no-celular">Novo contato</span></button>
    </header>
    <main class="tela" id="tela" tabindex="-1"></main>
  </div>
</div>

<dialog class="ficha" id="ficha" aria-label="Ficha do contato"></dialog>
<dialog class="janela" id="novo" aria-label="Novo contato"></dialog>
<dialog class="janela janela--pequena" id="janela-senha" aria-label="Minha senha">
  <form id="form-minha-senha" class="form-senha" novalidate>
    <h2>Minha senha</h2>
    <label class="campo">Senha atual
      <input type="password" name="atual" autocomplete="current-password" required>
    </label>
    <label class="campo">Nova senha (mín. 10 caracteres)
      <input type="password" name="nova" autocomplete="new-password" minlength="10" required>
    </label>
    <label class="campo">Repita a nova senha
      <input type="password" name="repetir" autocomplete="new-password" minlength="10" required>
    </label>
    <p class="aviso" id="senha-aviso" role="alert"></p>
    <div class="form-acoes">
      <button type="button" class="botao botao--fantasma" id="senha-cancelar">Cancelar</button>
      <button type="submit" class="botao botao--primario">Salvar nova senha</button>
    </div>
  </form>
</dialog>
<div class="avisos" id="avisos" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
